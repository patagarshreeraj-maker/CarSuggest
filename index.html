<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarSuggest: The Right Car for Indian Roads</title>
    <meta name="description" content="CarSuggest: AI-powered car recommendation, on-road prices, NCAP safety and 5-year ownership calculator for Indian buyers." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#e8edf4] text-[#101624] font-['Hanken_Grotesk',system-ui,sans-serif] antialiased min-h-screen">
    <script>
      // Apply dark class immediately based on system preference or saved pref (no FOUC)
      (function() {
        var saved = localStorage.getItem('carsuggest_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.body.style.background = '#0a1020';
        } else {
          document.body.style.background = '#e8edf4';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
